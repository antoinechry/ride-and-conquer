<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride &amp; Conquer · Choisir le fond de carte</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E4EADF;color:#14231D;font-family:'Figtree',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 20px;background:#0F1512;color:#fff}
header h1{margin:0;font-size:20px;font-weight:800}
header span{color:#B9C6BE;font-size:14px}
header label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:44px;cursor:pointer}
header a{color:#7FD9B2;font-weight:700;margin-left:auto;min-height:44px;display:flex;align-items:center}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;padding:8px}
.tile{position:relative;border-radius:16px;overflow:hidden;background:#cdd6c9;min-height:0}
.tile .m{position:absolute;inset:0}
.cap{position:absolute;z-index:1000;left:8px;top:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.cap .lab{background:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:auto;max-width:calc(100% - 100px)}
.cap b{display:block;font-size:15px}
.cap small{display:block;color:#4D5E55;font-size:12px;line-height:1.3}
.cap button{margin-left:auto;pointer-events:auto;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:#1F6F54;color:#fff;font:700 14px 'Figtree',sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.grid.solo{grid-template-columns:1fr}
.grid.solo .tile{display:none}
.grid.solo .tile.big{display:block}
.leaflet-control-attribution{font-size:9px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);overflow:auto;grid-auto-rows:60vh}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Choisir le fond de carte</h1>
  <span>Déplace ou zoome une carte : les autres suivent. « Voir seule » ouvre une carte en grand.</span>
  <label><input type="checkbox" id="demo" checked> Mailles d'exemple</label>
  <a href="index.html">Retour à l'application</a>
</header>
<div class="grid" id="grid"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const IGN=(layer,fmt)=>'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+layer+'&STYLE=normal&FORMAT='+fmt+'&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const OSM='Données © <a href="https://www.openstreetmap.org/copyright">contributeurs OpenStreetMap</a>';
const CARTO=OSM+' | © <a href="https://carto.com/attributions">CARTO</a>';
const LAYERS=[
 {k:'topo',name:'OpenTopoMap',desc:'Relief et courbes de niveau. Fond actuel.',url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',max:17,att:OSM+', SRTM | Rendu © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'},
 {k:'cyclosm',name:'CyclOSM',desc:'Pensée pour le vélo : pistes, revêtements, côtes.',url:'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',max:20,att:OSM+' | <a href="https://www.cyclosm.org">CyclOSM</a>'},
 {k:'osm',name:'OpenStreetMap',desc:'Le fond standard, très lisible.',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',max:19,att:OSM},
 {k:'osmfr',name:'OSM France',desc:'Même données, noms de lieux en français.',url:'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',max:20,att:OSM+' | Tuiles © OSM France'},
 {k:'voyager',name:'CARTO Voyager',desc:'Clair et sobre, les mailles ressortent bien.',url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',max:20,sub:'abcd',att:CARTO},
 {k:'positron',name:'CARTO Positron',desc:'Très pâle : idéal pour mettre les couleurs en avant.',url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',max:20,sub:'abcd',att:CARTO},
 {k:'dark',name:'CARTO Dark Matter',desc:'Fond sombre pour un mode nuit.',url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',max:20,sub:'abcd',att:CARTO},
 {k:'ign',name:'Plan IGN',desc:'Carte officielle française, Licence ouverte Etalab.',url:IGN('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'),max:19,att:'© <a href="https://geoservices.ign.fr">IGN</a> – Géoplateforme (Licence ouverte Etalab)'},
 {k:'ortho',name:'Photo aérienne IGN',desc:'Vue satellite/orthophoto, Licence ouverte Etalab.',url:IGN('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'),max:19,att:'© <a href="https://geoservices.ign.fr">IGN</a> – Géoplateforme (Licence ouverte Etalab)'}
];
const S=150,SM=L.Projection.SphericalMercator;
const h=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);};
// mailles d'exemple autour de Strasbourg : à toi (bleu), deux rivaux
function sample(){
  const c=SM.project(L.latLng(48.6,7.76)),cx=c.x/S,cy=c.y/S,out=[];
  const blobs=[[0,0,14,'m'],[10,-8,8,'m'],[-22,6,11,'r1'],[24,10,12,'r2'],[-4,-26,9,'r2'],[6,22,9,'r1']];
  for(let x=-45;x<=45;x++)for(let y=-40;y<=40;y++){
    let best=9,who=null;
    for(const b of blobs){const d=((x-b[0])**2+(y-b[1])**2)/(b[2]**2)+h(x,y)*.35;if(d<best){best=d;who=b[3];}}
    if(best<=1.1)out.push({x:Math.round(cx+x),y:Math.round(cy+y),who,old:h(x*3,y*5)>.84});
  }
  return out;
}
const CELLS=sample();
const COL={m:'47,111,235',r1:'232,120,90',r2:'150,110,200'};
const grid=document.getElementById('grid');
const maps=[];let lock=false;
LAYERS.forEach(l=>{
  const t=document.createElement('div');t.className='tile';
  t.innerHTML='<div class="m"></div><div class="cap"><div class="lab"><b></b><small></small></div><button type="button">Voir seule</button></div>';
  t.querySelector('b').textContent=l.name;t.querySelector('small').textContent=l.desc;grid.appendChild(t);
  const m=L.map(t.querySelector('.m'),{center:[48.6,7.76],zoom:12,zoomControl:false,attributionControl:true});
  L.tileLayer(l.url,{maxZoom:l.max,subdomains:l.sub||'abc',attribution:l.att}).addTo(m);
  const layer=L.layerGroup().addTo(m),rend=L.canvas({padding:.3});
  const o={t,m,layer,rend,l};
  m.on('move',()=>{if(lock)return;lock=true;maps.forEach(q=>{if(q!==o){q.m.setView(m.getCenter(),m.getZoom(),{animate:false});}});lock=false;});
  m.on('zoomend moveend',()=>drawAll());
  t.querySelector('button').addEventListener('click',e=>{
    const solo=!grid.classList.contains('solo');
    grid.classList.toggle('solo',solo);t.classList.toggle('big',solo);e.target.textContent=solo?'Tout afficher':'Voir seule';
    maps.forEach(q=>q.m.invalidateSize());m.setView(m.getCenter(),m.getZoom(),{animate:false});
  });
  maps.push(o);
});
function rect(x,y){const a=SM.unproject(L.point(x*S,y*S)),b=SM.unproject(L.point((x+1)*S,(y+1)*S));return [[a.lat,a.lng],[b.lat,b.lng]];}
function drawAll(){
  const on=document.getElementById('demo').checked;
  maps.forEach(q=>{
    q.layer.clearLayers();if(!on)return;
    if(q.m.getZoom()<11)return;
    const b=q.m.getBounds().pad(.1);
    CELLS.forEach(c=>{const r=rect(c.x,c.y);if(!b.intersects(L.latLngBounds(r)))return;
      q.layer.addLayer(L.rectangle(r,{renderer:q.rend,stroke:true,color:'#fff',weight:.6,opacity:.5,fillColor:'rgb('+COL[c.who]+')',fillOpacity:c.old?.18:(c.who==='m'?.6:.45),interactive:false}));});
  });
}
document.getElementById('demo').addEventListener('change',drawAll);
drawAll();
</script>
</body>
</html>
