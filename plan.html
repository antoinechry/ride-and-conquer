<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride & Conquer · Plan des connecteurs</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E4EADF}
a{color:#1F6F54}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="min-height: 900px; background: #E4EADF; color: #14231D; font-family: 'Figtree', system-ui, sans-serif">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 10px 28px; background: #0F1512; color: #FFFFFF">
    <div style="font-weight: 800; font-size: 22px; letter-spacing: -0.01em">Ride <span style="color: #7FD9B2">&amp;</span> Conquer</div>
    <div style="padding: 4px 12px; border-radius: 999px; background: #1F6F54; font-weight: 700; font-size: 13px">Document interne · connecteurs</div>
    <nav style="display: flex; flex-wrap: wrap; gap: 4px; flex-grow: 1">
      <a href="connexions.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Voir la page Connexions</a>
    </nav>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 32px 28px 56px; display: flex; flex-direction: column; gap: 32px; box-sizing: border-box">

    <div style="display: flex; flex-direction: column; gap: 8px; max-width: 800px">
      <h1 style="margin: 0; font-weight: 800; font-size: 40px; line-height: 1.1">Plan des connecteurs compteurs</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #4D5E55">Chaque fabricant garde les sorties dans son cloud et nous prévient quand il y en a une nouvelle. On récupère le fichier, on le normalise, puis le moteur de jeu calcule les mailles. Strava reste en sortie seulement.</p>
    </div>

    <section aria-label="Flux de données" style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-weight: 800; font-size: 20px">Le chemin d'une sortie</h2>
      <div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px">
        <sc-for list="{{flow}}" as="f" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 10px; flex: 1 1 190px">
            <div style="flex-grow: 1; align-self: stretch; padding: 16px; border-radius: 18px; background: {{f.bg}}; color: {{f.fg}}; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 12px rgba(20,35,29,0.08)">
              <div style="font-weight: 800; font-size: 16px">{{f.title}}</div>
              <div style="font-size: 13px; line-height: 1.4; opacity: 0.85">{{f.sub}}</div>
            </div>
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4D5E55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-label="Fabricants" style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-weight: 800; font-size: 20px">Où en est chaque fabricant</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px">
        <sc-for list="{{makers}}" as="m" hint-placeholder-count="4">
          <article style="display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 12px rgba(20,35,29,0.08)">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
              <div style="font-weight: 800; font-size: 22px">{{m.name}}</div>
              <div style="padding: 4px 11px; border-radius: 999px; background: {{m.pillBg}}; color: {{m.pillFg}}; font-weight: 700; font-size: 12px; text-align: right">{{m.status}}</div>
            </div>
            <dl style="margin: 0; display: flex; flex-direction: column; gap: 10px">
              <div><dt style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4D5E55">Accès</dt><dd style="margin: 2px 0 0; font-size: 14px; line-height: 1.45">{{m.access}}</dd></div>
              <div><dt style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4D5E55">Connexion</dt><dd style="margin: 2px 0 0; font-size: 14px; line-height: 1.45">{{m.auth}}</dd></div>
              <div><dt style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4D5E55">Données et alertes</dt><dd style="margin: 2px 0 0; font-size: 14px; line-height: 1.45">{{m.data}}</dd></div>
            </dl>
            <div style="margin-top: auto; padding: 12px 14px; border-radius: 14px; background: #F3F6F2; font-size: 14px; line-height: 1.45"><strong>Prochaine étape :</strong> {{m.next}}</div>
          </article>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

      <section style="flex: 1 1 420px; min-width: 0; padding: 24px; border-radius: 22px; background: #14231D; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-weight: 800; font-size: 20px">Ordre de lancement proposé</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
            <li style="display: flex; gap: 14px; align-items: flex-start">
              <span style="width: 32px; height: 32px; border-radius: 50%; background: #7FD9B2; color: #14231D; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0">{{s.n}}</span>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <div style="font-weight: 800; font-size: 16px">{{s.title}}</div>
                <div style="font-size: 14px; line-height: 1.45; color: #B9C6BE">{{s.sub}}</div>
              </div>
            </li>
          </sc-for>
        </ol>
      </section>

      <section style="flex: 1 1 420px; min-width: 0; padding: 24px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 12px rgba(20,35,29,0.08); display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-weight: 800; font-size: 20px">Règles communes à tous les connecteurs</h2>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
            <li style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="m5 12 5 5 9-10"></path></svg>
              <div><strong>{{r.title}}</strong> {{r.text}}</div>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>

    <section aria-label="Sources" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">
      <h2 style="margin: 0; font-weight: 800; font-size: 16px">Sources consultées</h2>
      <sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
        <a href="{{s.href}}" style="display: block; min-height: 24px; line-height: 1.5; word-break: break-word">{{s.label}}</a>
      </sc-for>
    </section>
  </main>
</div>
</template>
<script>

class DCLogic{constructor(){this.state={};}setState(p){this.state=Object.assign({},this.state,p);this.__render&&this.__render();}}
function __lookup(path,scope){var parts=path.trim().split('.');var v=scope;for(var i=0;i<parts.length;i++){if(v==null)return undefined;v=v[parts[i]];}return v;}
function __interp(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,function(_,p){var v=__lookup(p,scope);return v==null?'':String(v);});}
function __renderNode(node,scope,out){
  if(node.nodeType===3){out.appendChild(document.createTextNode(__interp(node.nodeValue,scope)));return;}
  if(node.nodeType!==1)return;
  var tag=node.localName;
  if(tag==='sc-for'){var list=__lookup(node.getAttribute('list').replace(/^\{\{|\}\}$/g,''),scope)||[];var as=node.getAttribute('as');
    list.forEach(function(item){var s=Object.assign({},scope);s[as]=item;for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,s,out);});return;}
  if(tag==='sc-if'){var v=__lookup(node.getAttribute('value').replace(/^\{\{|\}\}$/g,''),scope);if(v){for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,scope,out);}return;}
  var el=node.cloneNode(false);
  for(var i=0;i<node.attributes.length;i++){var a=node.attributes[i];
    if(/^on/i.test(a.name)&&/^\{\{.*\}\}$/.test(a.value.trim())){el.removeAttribute(a.name);var fn=__lookup(a.value.trim().replace(/^\{\{|\}\}$/g,''),scope);if(typeof fn==='function')el.addEventListener(a.name.slice(2).toLowerCase(),fn);}
    else if(a.value.indexOf('{{')>=0){el.setAttribute(a.name,__interp(a.value,scope));}}
  for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,scope,el);
  out.appendChild(el);
}
function __mount(Cls){var inst=new Cls();var tpl=document.getElementById('tpl');var root=document.getElementById('app');
  inst.__render=function(){var vals=inst.renderVals();var frag=document.createDocumentFragment();for(var c=tpl.content.firstChild;c;c=c.nextSibling)__renderNode(c,vals,frag);root.replaceChildren(frag);};
  inst.__render();}


class Component extends DCLogic {
  renderVals() {
    return {
      flow: [
        { title: 'Compteur', sub: 'Tu roules, il enregistre la sortie.', bg: '#FFFFFF', fg: '#14231D' },
        { title: 'Cloud du fabricant', sub: 'La sortie est envoyée sur ton compte chez eux.', bg: '#FFFFFF', fg: '#14231D' },
        { title: 'Alerte « nouvelle sortie »', sub: 'Le fabricant appelle notre adresse de notification.', bg: '#FFFFFF', fg: '#14231D' },
        { title: 'Notre serveur', sub: 'Télécharge le fichier FIT, le met au même format pour tous.', bg: '#1F6F54', fg: '#FFFFFF' },
        { title: 'Moteur de jeu', sub: 'Mailles, boucles, territoire, classements.', bg: '#14231D', fg: '#FFFFFF' }
      ],
      makers: [
        { name: 'Hammerhead', status: 'Prêt à démarrer', pillBg: '#D5EFE2', pillFg: '#14573F',
          access: 'Compte développeur à créer soi-même sur leur portail, sans validation longue annoncée.',
          auth: 'Connexion OAuth : l’utilisateur autorise l’accès depuis son compte Hammerhead.',
          data: 'Sorties de Karoo avec trace GPS, reçues par notification à chaque nouvelle sortie.',
          next: 'Créer le compte développeur et tester avec ton propre Karoo.' },
        { name: 'Wahoo', status: 'Prêt à démarrer (bac à sable)', pillBg: '#D5EFE2', pillFg: '#14573F',
          access: 'Accès de test immédiat, puis passage en production après une revue de l’appli par Wahoo.',
          auth: 'Connexion OAuth depuis le compte Wahoo de l’utilisateur.',
          data: 'Fichiers FIT des sorties ELEMNT, avec notification par adresse (webhook).',
          next: 'Ouvrir le bac à sable, brancher la réception des sorties, préparer le dossier de revue.' },
        { name: 'COROS', status: 'Demande à déposer', pillBg: '#F6EFC6', pillFg: '#6B5A05',
          access: 'Programme partenaire sur demande : il faut déposer un dossier et attendre leur retour.',
          auth: 'Connexion OAuth une fois le partenariat accordé.',
          data: 'Sorties au format FIT et données de santé selon les droits accordés.',
          next: 'Envoyer la demande d’accès dès que l’appli a une démo présentable (les maquettes suffisent pour le premier contact).' },
        { name: 'Garmin', status: 'Bloqué pour l’instant', pillBg: '#FBE0DA', pillFg: '#A12A15',
          access: 'Nouvelles demandes d’accès gelées depuis le printemps 2026, d’après la presse spécialisée.',
          auth: 'OAuth via Garmin Connect, quand l’accès rouvre.',
          data: 'API Activity : fichiers FIT, avec notifications à chaque sortie synchronisée.',
          next: 'Déposer une demande quand le programme rouvre. D’ici là, import FIT/GPX à la main.' }
      ],
      steps: [
        { n: '1', title: 'Import FIT / GPX à la main', sub: 'Fonctionne avec tous les compteurs, sans dépendre de personne. Sert aussi à bâtir et tester le moteur de jeu.' },
        { n: '2', title: 'Wahoo et Hammerhead', sub: 'Les deux accès sont ouverts. Premiers connecteurs automatiques, testés sur de vraies sorties.' },
        { n: '3', title: 'COROS', sub: 'Dossier à déposer en parallèle, activé dès l’accord reçu.' },
        { n: '4', title: 'Garmin', sub: 'À la réouverture du programme. Le plus gros parc de compteurs, mais le moins prévisible côté calendrier.' }
      ],
      rules: [
        { title: 'Un seul format interne.', text: 'Source, identifiant, heure de départ, trace GPS, sport. Le moteur de jeu ne connaît pas les fabricants.' },
        { title: 'Pas de doublon.', text: 'Une même sortie reçue de deux sources ou importée deux fois ne compte qu’une fois.' },
        { title: 'Contrôle de vitesse.', text: 'Une trace trop rapide pour le sport déclaré (voiture, moteur) est mise en revue avant de compter.' },
        { title: 'Départ propre.', text: 'À la déconnexion, on coupe l’accès au compteur et on supprime les données reçues si l’utilisateur le demande.' },
        { title: 'Strava en sortie seulement.', text: 'On publie les conquêtes, on ne lit jamais les sorties Strava.' }
      ],
      sources: [
        { label: 'Garmin : accès développeur en pause (the5krunner, sept. 2026)', href: 'https://the5krunner.com/2026/09/14/garmin-developer-api-access-paused/' },
        { label: 'Garmin : API Activity, programme développeur', href: 'https://developer.garmin.com/gc-developer-program/activity-api/' },
        { label: 'Hammerhead : créer un compte développeur', href: 'https://support.hammerhead.io/hc/en-us/articles/43558376710683-Creating-a-Developer-Account' },
        { label: 'Wahoo : fiche API (API Evangelist)', href: 'https://providers.apievangelist.com/providers/wahoo/' },
        { label: 'COROS : accès API (support COROS)', href: 'https://support.coros.com/hc/en-us/articles/360040256531' }
      ]
    };
  }
}

__mount(Component);
</script>
</body>
</html>
