<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride & Conquer · Carte</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E4EADF}
a{color:#1F6F54}a:hover{color:#2B8A6B}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="min-height: 900px; background: #E4EADF; color: #14231D; font-family: 'Figtree', system-ui, sans-serif">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 10px 28px; background: #0F1512; color: #FFFFFF">
    <div style="font-weight: 800; font-size: 22px; letter-spacing: -0.01em">Ride <span style="color: #7FD9B2">&amp;</span> Conquer</div>
    <nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; gap: 4px; flex-grow: 1">
      <a href="index.html" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #E4EADF; color: #14231D; font-weight: 700; font-size: 15px; text-decoration: none">Carte</a>
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Mon territoire</a>
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Classements</a>
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Clubs</a>
      <a href="connexions.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Connexions<span style="width: 8px; height: 8px; border-radius: 50%; background: #7FD9B2"></span></a>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; color: #B9C6BE">Automne · J-54</div>
      <a href="connexions.html" aria-label="Mon profil" style="width: 44px; height: 44px; border-radius: 50%; background: #1F6F54; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; text-decoration: none">AC</a>
    </div>
  </header>

  <main style="max-width: 1440px; margin: 0 auto; padding: 24px 28px 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; box-sizing: border-box">

    <section aria-label="Carte des territoires" style="position: relative; flex: 999 1 600px; min-width: 0; height: 700px; border-radius: 24px; overflow: hidden; background: #DCE5D6; box-shadow: 0 4px 22px rgba(20,35,29,0.14)">

      <div style="position: absolute; left: 50%; margin-left: -550px; top: 0; width: 1100px; height: 700px">
        <img alt="" src="img/strasbourg.jpg" style="position: absolute; left: -243px; top: -76px; width: 1371px; height: 1112px; max-width: none">
        <div style="position: absolute; left: 0; top: 0; display: grid; grid-template-columns: repeat(42, 26px); grid-auto-rows: 26px">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="1092">
            <div style="background: {{c.bg}}; box-shadow: inset 0 0 0 1px {{c.bd}}"></div>
          </sc-for>
        </div>
        <svg aria-hidden="true" width="1100" height="700" viewBox="0 0 1100 700" style="position: absolute; left: 0; top: 0">
          <sc-if value="{{isSolo}}" hint-placeholder-val="{{true}}">
            <path d="M440 240 C 530 210 650 270 670 350 C 682 420 610 460 545 480 C 490 498 450 450 425 400 C 395 340 405 275 440 240 Z" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linejoin="round"></path>
            <path d="M440 240 C 530 210 650 270 670 350 C 682 420 610 460 545 480 C 490 498 450 450 425 400 C 395 340 405 275 440 240 Z" stroke="#2F6FEB" stroke-width="3.5" fill="none" stroke-linejoin="round"></path>
          </sc-if>
        </svg>
        <sc-for list="{{pills}}" as="p" hint-placeholder-count="4">
          <div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #1F6F54; color: #1F6F54; font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 8px rgba(20,35,29,0.18)">{{p.name}}</div>
        </sc-for>
        <div style="position: absolute; left: {{meLeft}}px; top: {{meTop}}px; width: 16px; height: 16px; border-radius: 50%; background: #2F6FEB; border: 3px solid #FFFFFF; box-shadow: 0 2px 8px rgba(20,35,29,0.3)"></div>
      </div>

      <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <div role="group" aria-label="Choix de la carte" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 16px rgba(20,35,29,0.18)">
          <button onClick="{{pickSolo}}" style="border: 0; min-height: 44px; padding: 0 22px; border-radius: 999px; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; background: {{soloBg}}; color: {{soloFg}}">Solo</button>
          <button onClick="{{pickClub}}" style="border: 0; min-height: 44px; padding: 0 22px; border-radius: 999px; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; background: {{clubBg}}; color: {{clubFg}}">Club</button>
        </div>
        <div role="group" aria-label="Discipline" style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{discs}}" as="d" hint-placeholder-count="3">
            <button onClick="{{d.pick}}" style="min-height: 44px; padding: 0 20px; border-radius: 14px; border: 1.5px solid #14231D; background: {{d.bg}}; color: {{d.fg}}; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">{{d.label}}</button>
          </sc-for>
        </div>
        <button aria-label="Me localiser" style="margin-left: auto; width: 48px; height: 48px; border-radius: 50%; border: 0; background: #FFFFFF; color: #2F6FEB; box-shadow: 0 4px 16px rgba(20,35,29,0.18); display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11 21 3l-8 18-2-8-8-2z"></path></svg></button>
      </div>

      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,0.96); box-shadow: 0 4px 16px rgba(20,35,29,0.18)">
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 240px">
          <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #4D5E55"><div>Saison d'automne</div><div>Fin dans 54 j</div></div>
          <div style="position: relative; height: 26px; border-radius: 8px; background: #EEF2EE; overflow: hidden">
            <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 40%; background: #D5E3DA"></div>
            <div style="position: absolute; left: 40%; top: 0; bottom: 0; width: 2px; background: #14231D"></div>
            <div style="position: absolute; left: 40%; top: 4px; margin-left: 6px; padding: 1px 7px; border-radius: 6px; background: #14231D; color: #FFFFFF; font-size: 10px; font-weight: 800; letter-spacing: 0.06em">AUJOURD'HUI</div>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; font-weight: 600; color: #4D5E55">
          <div style="display: flex; align-items: center; gap: 6px"><div style="width: 12px; height: 12px; border-radius: 3px; background: #2F6FEB"></div>{{mineLabel}}</div>
          <div style="display: flex; align-items: center; gap: 6px"><div style="width: 12px; height: 12px; border-radius: 3px; background: #E8785A"></div>Rivaux</div>
          <div style="display: flex; align-items: center; gap: 6px"><div style="width: 12px; height: 12px; border-radius: 3px; background: rgba(47,111,235,0.2); border: 1px dashed #2F6FEB; box-sizing: border-box"></div>Pâlit</div>
        </div>
      </div>
    </section>

    <aside aria-label="Résumé" style="flex: 1 1 340px; max-width: 460px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

      <section style="padding: 20px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 12px rgba(20,35,29,0.08); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 13px; font-weight: 600; color: #4D5E55">{{label}}</div>
            <div style="font-weight: 800; font-size: 44px; line-height: 1.05">{{total}} <span style="font-size: 18px; color: #4D5E55">km²</span></div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <div style="font-size: 13px; font-weight: 600; color: #4D5E55">{{zone}}</div>
            <div style="font-weight: 800; font-size: 44px; line-height: 1.05; color: #1F6F54">{{rank}}</div>
          </div>
        </div>
        <div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px">
          <div style="width: 90.8%; background: #2F6FEB"></div>
          <div style="width: 4.5%; background: #E58A1F"></div>
          <div style="width: 4.7%; background: #D93F1F"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #F3F6F2">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#B8860B"><path d="M3 18 2 7l5 4 5-7 5 7 5-4-1 11H3z"></path></svg>
          <div style="flex-grow: 1; font-size: 14px; color: #4D5E55">Roi de Schiltigheim · <strong style="color: #14231D">Julien M.</strong></div>
          <div style="font-weight: 800; font-size: 15px">68,4 km²</div>
        </div>
        <button style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; border: 0; background: #1F6F54; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-weight: 800; font-size: 17px; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg>Planifier une sortie</button>
      </section>

      <section style="padding: 20px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 12px rgba(20,35,29,0.08); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-weight: 800; font-size: 19px">À défendre</h2>
          <div style="font-size: 13px; font-weight: 600; color: #4D5E55">3 zones · 1,9 km²</div>
        </div>
        <sc-for list="{{zones}}" as="z" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #F3F6F2">
            <div style="min-width: 44px; height: 44px; border-radius: 50%; background: {{z.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0">{{z.left}}</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <div style="font-weight: 700; font-size: 15px">{{z.name}}</div>
              <div style="font-size: 12px; color: #4D5E55">{{z.area}} · passage il y a {{z.since}}</div>
            </div>
            <button style="flex-shrink: 0; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #14231D; background: #FFFFFF; color: #14231D; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer">Repasser</button>
          </div>
        </sc-for>
      </section>

      <a href="connexions.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 22px; background: #14231D; color: #FFFFFF; text-decoration: none">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #1F6F54; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H6a4 4 0 0 0 0 8h3M15 7h3a4 4 0 0 1 0 8h-3M8 11h8"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
          <div style="font-weight: 800; font-size: 15px">Dernière sortie importée de ton Wahoo</div>
          <div style="font-size: 13px; color: #B9C6BE">Tour du Kochersberg · +18,4 km² · il y a 2 h</div>
        </div>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </aside>
  </main>
</div>
</template>
<script>

class DCLogic{constructor(){this.state={};}setState(p){this.state=Object.assign({},this.state,p);this.__render&&this.__render();}}
function __lookup(path,scope){var parts=path.trim().split('.');var v=scope;for(var i=0;i<parts.length;i++){if(v==null)return undefined;v=v[parts[i]];}return v;}
function __interp(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,function(_,p){var v=__lookup(p,scope);return v==null?'':String(v);});}
function __renderNode(node,scope,out){
  if(node.nodeType===3){out.appendChild(document.createTextNode(__interp(node.nodeValue,scope)));return;}
  if(node.nodeType!==1)return;
  var tag=node.localName;
  if(tag==='sc-for'){var list=__lookup(node.getAttribute('list').replace(/^\{\{|\}\}$/g,''),scope)||[];var as=node.getAttribute('as');
    list.forEach(function(item){var s=Object.assign({},scope);s[as]=item;for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,s,out);});return;}
  if(tag==='sc-if'){var v=__lookup(node.getAttribute('value').replace(/^\{\{|\}\}$/g,''),scope);if(v){for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,scope,out);}return;}
  var el=node.cloneNode(false);
  for(var i=0;i<node.attributes.length;i++){var a=node.attributes[i];
    if(/^on/i.test(a.name)&&/^\{\{.*\}\}$/.test(a.value.trim())){el.removeAttribute(a.name);var fn=__lookup(a.value.trim().replace(/^\{\{|\}\}$/g,''),scope);if(typeof fn==='function')el.addEventListener(a.name.slice(2).toLowerCase(),fn);}
    else if(a.value.indexOf('{{')>=0){el.setAttribute(a.name,__interp(a.value,scope));}}
  for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,scope,el);
  out.appendChild(el);
}
function __mount(Cls){var inst=new Cls();var tpl=document.getElementById('tpl');var root=document.getElementById('app');
  inst.__render=function(){var vals=inst.renderVals();var frag=document.createDocumentFragment();for(var c=tpl.content.firstChild;c;c=c.nextSibling)__renderNode(c,vals,frag);root.replaceChildren(frag);};
  inst.__render();}


class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var mode = st.mode || 'solo';
    var disc = st.disc || 0;
    var solo = mode === 'solo';
    var MINE = ['rgba(47,111,235,0.6)', 'rgba(47,111,235,0.2)'];
    var RIV = ['rgba(232,120,90,0.42)', 'rgba(222,178,60,0.5)', 'rgba(150,110,200,0.38)', 'rgba(46,160,130,0.42)', 'rgba(120,140,160,0.42)'];
    var h = function (x, y) { var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
    var mine = [[20, 12, 6], [25, 10, 4], [16, 15, 4]];
    var riv = [[5, 5, 6, 0], [34, 5, 6, 1], [6, 18, 5, 2], [36, 16, 5, 3], [26, 22, 6, 4], [12, 24, 4, 1], [40, 23, 4, 0], [22, 3, 4, 3], [8, 11, 4, 3], [31, 12, 4, 2], [14, 3, 3, 4]];
    var all = [];
    mine.forEach(function (m) { all.push({ x: solo ? m[0] : 41 - m[0], y: solo ? m[1] : m[1] + (m[0] * 3) % 5, r: solo ? m[2] : m[2] * 1.3, o: -1 }); });
    riv.forEach(function (m) { all.push({ x: solo ? m[0] : 41 - m[0], y: solo ? m[1] : m[1] + (m[0] * 3) % 5, r: m[2], o: m[3] }); });
    var cells = [];
    for (var y = 0; y < 27; y++) {
      for (var x = 0; x < 42; x++) {
        var best = 9, bo = null;
        all.forEach(function (c) {
          var d = ((x - c.x) * (x - c.x) + (y - c.y) * (y - c.y)) / (c.r * c.r) + h(x + (solo ? 0 : 7), y) * 0.35;
          if (d < best) { best = d; bo = c.o; }
        });
        var bd = 'rgba(255,255,255,0.4)';
        if (best > 1.15) { cells.push({ bg: 'transparent', bd: 'rgba(255,255,255,0.1)' }); }
        else if (bo === -1) { cells.push({ bg: h(x * 3, y * 5) > 0.82 ? MINE[1] : MINE[0], bd: bd }); }
        else { cells.push({ bg: RIV[bo], bd: bd }); }
      }
    }
    var names = solo ? ['Léa W.', '★ Julien M.', 'Sophie K.', 'Marc H.'] : ['VC Hœnheim', '★ Les Vagabonds', 'Gravel Kocher', 'Team Bischheim'];
    var pills = [];
    [3, 4, 5, 6].forEach(function (idx, k) {
      var c = all[idx];
      var top = c.y * 26 + 13 - 14, left = c.x * 26 + 13 - 45;
      if (top > 80 && top < 590 && left > 10 && left < 1000) { pills.push({ name: names[k], left: left, top: top }); }
    });
    var me = all[0];
    var discs = ['Route', 'Gravel', 'VTT'].map(function (l, i) {
      return { label: l, bg: i === disc ? '#14231D' : '#FFFFFF', fg: i === disc ? '#FFFFFF' : '#14231D', pick: function () { self.setState({ disc: i }); } };
    });
    return {
      cells: cells, pills: pills, discs: discs, isSolo: solo,
      meLeft: me.x * 26 + 13 - 8, meTop: me.y * 26 + 13 - 8,
      total: solo ? '42,6' : '86,3',
      label: solo ? 'Territoire détenu' : 'Les Vélos du Mercredi',
      zone: solo ? 'Schiltigheim' : 'Bas-Rhin',
      rank: solo ? '3e' : '2e',
      mineLabel: solo ? 'À toi' : 'Ton club',
      soloBg: solo ? '#1F6F54' : 'transparent', soloFg: solo ? '#FFFFFF' : '#14231D',
      clubBg: solo ? 'transparent' : '#1F6F54', clubFg: solo ? '#14231D' : '#FFFFFF',
      pickSolo: function () { self.setState({ mode: 'solo' }); },
      pickClub: function () { self.setState({ mode: 'club' }); },
      zones: [
        { name: 'Reichstett, berges du canal', area: '0,6 km²', since: '19 j', left: 'J-2', color: '#D93F1F' },
        { name: 'Vendenheim, route de Brumath', area: '0,8 km²', since: '17 j', left: 'J-4', color: '#C26F12' },
        { name: 'Mittelhausbergen', area: '0,5 km²', since: '15 j', left: 'J-6', color: '#8F7508' }
      ]
    };
  }
}

__mount(Component);
</script>
</body>
</html>
