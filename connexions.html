<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride & Conquer · Connexions</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E4EADF}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="min-height: 900px; background: #E4EADF; color: #14231D; font-family: 'Figtree', system-ui, sans-serif">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 10px 28px; background: #0F1512; color: #FFFFFF">
    <div style="font-weight: 800; font-size: 22px; letter-spacing: -0.01em">Ride <span style="color: #7FD9B2">&amp;</span> Conquer</div>
    <nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; gap: 4px; flex-grow: 1">
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Carte</a>
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Mon territoire</a>
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Classements</a>
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Clubs</a>
      <a href="connexions.html" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #E4EADF; color: #14231D; font-weight: 700; font-size: 15px; text-decoration: none">Connexions</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; color: #B9C6BE">Automne · J-54</div>
      <div aria-label="Mon profil" style="width: 44px; height: 44px; border-radius: 50%; background: #1F6F54; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px">AC</div>
    </div>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 32px 28px 56px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">

    <div style="display: flex; flex-direction: column; gap: 8px; max-width: 760px">
      <h1 style="margin: 0; font-weight: 800; font-size: 40px; line-height: 1.1">Connecter mon compteur</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #4D5E55">Tes sorties arrivent toutes seules, dès que ton compteur les envoie. Chaque sortie compte pour ton territoire, sans rien exporter à la main.</p>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px">
      <li style="display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 999px; background: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: #1F6F54; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">1</span><span style="font-weight: 700; font-size: 15px">Choisir ton compteur</span></li>
      <li style="display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 999px; background: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: #14231D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">2</span><span style="font-weight: 700; font-size: 15px">Autoriser l'accès à tes sorties</span></li>
      <li style="display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 999px; background: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: #14231D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">3</span><span style="font-weight: 700; font-size: 15px">Rouler : la sortie arrive seule</span></li>
    </ol>

    <section aria-label="Compteurs" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
      <sc-for list="{{devices}}" as="d" hint-placeholder-count="4">
        <article style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 12px rgba(20,35,29,0.08); border: 2px solid {{d.border}}">
          <div style="display: flex; align-items: center; gap: 14px">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: #14231D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex-shrink: 0">{{d.mono}}</div>
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <div style="font-weight: 800; font-size: 20px">{{d.name}}</div>
              <div style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: {{d.pillBg}}; color: {{d.pillFg}}; font-weight: 700; font-size: 12px">{{d.status}}</div>
            </div>
          </div>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4D5E55; flex-grow: 1">{{d.text}}</p>
          <button onClick="{{d.act}}" style="min-height: 48px; border-radius: 999px; border: 1.5px solid {{d.btnBorder}}; background: {{d.btnBg}}; color: {{d.btnFg}}; font-family: 'Figtree', sans-serif; font-weight: 800; font-size: 15px; cursor: pointer">{{d.btn}}</button>
        </article>
      </sc-for>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

      <section style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 32px 20px; border-radius: 22px; border: 2px dashed #9DB3A5; background: rgba(255,255,255,0.55); text-align: center">
          <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
          <div style="font-weight: 800; font-size: 18px">Importer une sortie à la main</div>
          <div style="font-size: 14px; color: #4D5E55; max-width: 360px">Dépose un fichier FIT ou GPX exporté depuis n'importe quel compteur. C'est aussi la solution en attendant les connexions automatiques.</div>
          <button style="margin-top: 6px; min-height: 48px; padding: 0 24px; border-radius: 999px; border: 0; background: #14231D; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-weight: 800; font-size: 15px; cursor: pointer">Choisir un fichier</button>
        </div>

        <div style="display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 12px rgba(20,35,29,0.08)">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #FC4C02; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0">S</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <div style="font-weight: 800; font-size: 16px">Strava · envoi uniquement</div>
            <div style="font-size: 13px; color: #4D5E55">On y publie tes conquêtes. On ne lit jamais tes sorties Strava.</div>
          </div>
          <button role="switch" aria-checked="{{stravaOn}}" aria-label="Envoyer mes conquêtes vers Strava" onClick="{{toggleStrava}}" style="width: 64px; height: 44px; border-radius: 999px; border: 0; background: {{stravaBg}}; position: relative; cursor: pointer; flex-shrink: 0">
            <span style="position: absolute; top: 6px; left: {{stravaKnob}}px; width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3)"></span>
          </button>
        </div>
      </section>

      <section style="flex: 1 1 380px; min-width: 0; padding: 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 2px 12px rgba(20,35,29,0.08); display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 0 6px; font-weight: 800; font-size: 19px">Dernières synchronisations</h2>
        <sc-for list="{{logs}}" as="l" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #E1E7E2">
            <div style="padding: 3px 10px; border-radius: 999px; background: {{l.bg}}; color: {{l.fg}}; font-weight: 700; font-size: 12px; flex-shrink: 0; min-width: 76px; text-align: center; box-sizing: border-box">{{l.tag}}</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <div style="font-weight: 700; font-size: 15px">{{l.title}}</div>
              <div style="font-size: 13px; color: #4D5E55">{{l.sub}}</div>
            </div>
            <div style="font-size: 12px; color: #4D5E55; flex-shrink: 0">{{l.when}}</div>
          </div>
        </sc-for>
      </section>
    </div>
  </main>
</div>
</template>
<script>

class DCLogic{constructor(){this.state={};}setState(p){this.state=Object.assign({},this.state,p);this.__render&&this.__render();}}
function __lookup(path,scope){var parts=path.trim().split('.');var v=scope;for(var i=0;i<parts.length;i++){if(v==null)return undefined;v=v[parts[i]];}return v;}
function __interp(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,function(_,p){var v=__lookup(p,scope);return v==null?'':String(v);});}
function __renderNode(node,scope,out){
  if(node.nodeType===3){out.appendChild(document.createTextNode(__interp(node.nodeValue,scope)));return;}
  if(node.nodeType!==1)return;
  var tag=node.localName;
  if(tag==='sc-for'){var list=__lookup(node.getAttribute('list').replace(/^\{\{|\}\}$/g,''),scope)||[];var as=node.getAttribute('as');
    list.forEach(function(item){var s=Object.assign({},scope);s[as]=item;for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,s,out);});return;}
  if(tag==='sc-if'){var v=__lookup(node.getAttribute('value').replace(/^\{\{|\}\}$/g,''),scope);if(v){for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,scope,out);}return;}
  var el=node.cloneNode(false);
  for(var i=0;i<node.attributes.length;i++){var a=node.attributes[i];
    if(/^on/i.test(a.name)&&/^\{\{.*\}\}$/.test(a.value.trim())){el.removeAttribute(a.name);var fn=__lookup(a.value.trim().replace(/^\{\{|\}\}$/g,''),scope);if(typeof fn==='function')el.addEventListener(a.name.slice(2).toLowerCase(),fn);}
    else if(a.value.indexOf('{{')>=0){el.setAttribute(a.name,__interp(a.value,scope));}}
  for(var c=node.firstChild;c;c=c.nextSibling)__renderNode(c,scope,el);
  out.appendChild(el);
}
function __mount(Cls){var inst=new Cls();var tpl=document.getElementById('tpl');var root=document.getElementById('app');
  inst.__render=function(){var vals=inst.renderVals();var frag=document.createDocumentFragment();for(var c=tpl.content.firstChild;c;c=c.nextSibling)__renderNode(c,vals,frag);root.replaceChildren(frag);};
  inst.__render();}


class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var hh = st.hammer === true;
    var strava = st.strava !== false;
    var noop = function () {};
    var devices = [
      { name: 'COROS', mono: 'CO', status: 'Bientôt', pillBg: '#F6EFC6', pillFg: '#6B5A05', border: 'transparent',
        text: 'Pace, Apex, Vertix, Dura. La connexion automatique arrive : on attend l’accord de COROS. Importe un fichier FIT en attendant.',
        btn: 'Me prévenir', btnBg: '#FFFFFF', btnFg: '#14231D', btnBorder: '#14231D', act: noop },
      { name: 'Garmin', mono: 'GA', status: 'Bientôt', pillBg: '#F6EFC6', pillFg: '#6B5A05', border: 'transparent',
        text: 'Edge et montres Garmin Connect. Garmin ne prend pas de nouvelles demandes pour le moment. Importe un fichier FIT en attendant.',
        btn: 'Me prévenir', btnBg: '#FFFFFF', btnFg: '#14231D', btnBorder: '#14231D', act: noop },
      { name: 'Wahoo', mono: 'WA', status: 'Connecté', pillBg: '#D5EFE2', pillFg: '#14573F', border: '#1F6F54',
        text: 'ELEMNT Bolt, Roam, Rival. Dernière sortie reçue il y a 2 h : Tour du Kochersberg.',
        btn: 'Déconnecter', btnBg: '#FFFFFF', btnFg: '#A12A15', btnBorder: '#D9B5AC', act: noop },
      { name: 'Hammerhead', mono: 'HH', status: hh ? 'Connecté' : 'Disponible', pillBg: hh ? '#D5EFE2' : '#E1E7E2', pillFg: hh ? '#14573F' : '#4D5E55', border: hh ? '#1F6F54' : 'transparent',
        text: 'Karoo 2 et Karoo 3. Tes sorties sont envoyées sur ton compte dès la fin de l’enregistrement.',
        btn: hh ? 'Déconnecter' : 'Connecter', btnBg: hh ? '#FFFFFF' : '#1F6F54', btnFg: hh ? '#A12A15' : '#FFFFFF', btnBorder: hh ? '#D9B5AC' : '#1F6F54',
        act: function () { self.setState({ hammer: !hh }); } }
    ];
    var logs = [
      { tag: 'Importée', bg: '#D5EFE2', fg: '#14573F', title: 'Tour du Kochersberg', sub: 'Wahoo ELEMNT · 62 km · +18,4 km² conquis', when: 'il y a 2 h' },
      { tag: 'Doublon', bg: '#E1E7E2', fg: '#4D5E55', title: 'Tour du Kochersberg', sub: 'Déjà reçue depuis Wahoo, ignorée', when: 'il y a 2 h' },
      { tag: 'Importée', bg: '#D5EFE2', fg: '#14573F', title: 'Sortie du soir', sub: 'Fichier FIT · 24 km · +1,2 km² conquis', when: 'hier' },
      { tag: 'Vérifiée', bg: '#FCE9CF', fg: '#8A4B05', title: 'Descente du Ried', sub: 'Vitesse trop élevée sur 1 passage, revue automatique', when: 'lundi' }
    ];
    return {
      devices: devices, logs: logs,
      stravaOn: strava ? 'true' : 'false',
      stravaBg: strava ? '#1F6F54' : '#B9C6BE',
      stravaKnob: strava ? 26 : 6,
      toggleStrava: function () { self.setState({ strava: !strava }); }
    };
  }
}

__mount(Component);
</script>
</body>
</html>
