<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride &amp; Conquer · Tuiles des fonds de carte</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E4EADF;color:#14231D;font-family:'Figtree',system-ui,sans-serif}
header{padding:14px 24px;background:#0F1512;color:#fff;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
header h1{margin:0;font-size:20px;font-weight:800}
header a{color:#7FD9B2;font-weight:700;margin-left:auto;min-height:44px;display:flex;align-items:center}
main{max-width:1200px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:22px}
p.sub{margin:0;color:#4D5E55;max-width:720px;line-height:1.5}
section{background:#fff;border-radius:22px;padding:18px;box-shadow:0 2px 12px rgba(20,35,29,.08)}
h2{margin:0;font-size:20px;font-weight:800}
.d{margin:2px 0 12px;color:#4D5E55;font-size:14px}
.rows{display:flex;flex-wrap:wrap;gap:16px}
.row{flex:1 1 360px}
.row small{display:block;font-weight:700;font-size:12px;color:#4D5E55;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.t{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-radius:12px;overflow:hidden;background:#cdd6c9}
.t img{display:block;width:100%;height:auto;aspect-ratio:1;background:#cdd6c9}
.att{font-size:11px;color:#4D5E55;margin-top:6px}
</style>
</head>
<body>
<header><h1>Tuiles des fonds de carte</h1><a href="fonds.html">Comparer sur une carte</a></header>
<main>
  <p class="sub">Chaque fond est montré autour de Strasbourg, à deux niveaux de zoom : la vue d'ensemble (zoom 12) et la vue de quartier (zoom 15), celle où l'on voit les mailles une à une. Si une tuile reste grise, ce fond ne charge pas.</p>
  <div id="out" style="display:flex;flex-direction:column;gap:22px"></div>
</main>
<script>
const IGN=(layer,fmt)=>'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+layer+'&STYLE=normal&FORMAT='+fmt+'&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const OSM='Données © contributeurs OpenStreetMap';
const L=[
 {n:'OpenTopoMap',d:'Relief et courbes de niveau. Fond actuel.',u:'https://a.tile.opentopomap.org/{z}/{x}/{y}.png',a:OSM+', SRTM | Rendu © OpenTopoMap (CC-BY-SA)',max:17},
 {n:'CyclOSM',d:'Pensé pour le vélo : pistes, revêtements, côtes.',u:'https://a.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',a:OSM+' | CyclOSM'},
 {n:'OpenStreetMap',d:'Le fond standard, très lisible.',u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',a:OSM},
 {n:'OSM France',d:'Mêmes données, noms de lieux en français.',u:'https://a.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',a:OSM+' | Tuiles © OSM France'},
 {n:'CARTO Voyager',d:'Clair et sobre.',u:'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',a:OSM+' | © CARTO'},
 {n:'CARTO Positron',d:'Très pâle : fait ressortir les couleurs.',u:'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',a:OSM+' | © CARTO'},
 {n:'CARTO Dark Matter',d:'Fond sombre pour un mode nuit.',u:'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',a:OSM+' | © CARTO'},
 {n:'Plan IGN',d:'Carte officielle française, Licence ouverte Etalab.',u:IGN('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'),a:'© IGN – Géoplateforme (Licence ouverte Etalab)'},
 {n:'Photo aérienne IGN',d:'Orthophoto, Licence ouverte Etalab.',u:IGN('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'),a:'© IGN – Géoplateforme (Licence ouverte Etalab)'}
];
const LAT=48.5846,LON=7.7507;
function tile(z){const n=2**z,r=LAT*Math.PI/180;return [Math.floor((LON+180)/360*n),Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)];}
const out=document.getElementById('out');
L.forEach(l=>{
  const sec=document.createElement('section');
  sec.innerHTML='<h2></h2><div class="d"></div><div class="rows"></div><div class="att"></div>';
  sec.querySelector('h2').textContent=l.n;sec.querySelector('.d').textContent=l.d;sec.querySelector('.att').textContent=l.a;
  const rows=sec.querySelector('.rows');
  [[12,'Vue d’ensemble · zoom 12'],[15,'Vue de quartier · zoom 15']].forEach(([z,label])=>{
    const [cx,cy]=tile(z),row=document.createElement('div');row.className='row';
    row.innerHTML='<small></small><div class="t"></div>';row.querySelector('small').textContent=label;
    const t=row.querySelector('.t');
    for(let dy=0;dy<2;dy++)for(let dx=-1;dx<=1;dx++){
      const img=new Image();img.alt='';img.loading='lazy';img.referrerPolicy='origin';
      img.src=l.u.replace('{z}',z).replace('{x}',cx+dx).replace('{y}',cy+dy);t.appendChild(img);}
    rows.appendChild(row);
  });
  out.appendChild(sec);
});
</script>
</body>
</html>
